name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: CI only reads the code. No secrets are used anywhere in this repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS — build & test
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Unit tests
        run: swift test --package-path macos

      - name: Build
        run: macos/build.sh

      # Opens the real wheel and switches between Calculator and TextEdit. It needs a window
      # server session, which hosted runners may not give us, so a failure here is reported
      # but does not block the build. It always passes on a normal Mac.
      - name: End-to-end smoke test
        continue-on-error: true
        run: macos/scripts/smoke-test.sh

  windows:
    name: Windows — build & test
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build windows/Whirl.slnx -c Release

      - name: Test
        run: dotnet test --solution windows/Whirl.slnx -c Release --no-build

      # Opens the real wheel over two Notepad windows and checks Windows reports the chosen one
      # as the foreground window. Foreground rules on hosted runners are unpredictable, so a
      # failure is reported but does not block the build.
      - name: End-to-end smoke test (best effort)
        continue-on-error: true
        shell: pwsh
        run: |
          $exe = Get-ChildItem windows/src/Whirl/bin/Release -Recurse -Filter Whirl.exe | Select-Object -First 1
          $p = Start-Process $exe.FullName -ArgumentList '--self-test' -Wait -PassThru -RedirectStandardOutput self-test.txt
          Get-Content self-test.txt
          if ($p.ExitCode -ne 0) { throw "Whirl.exe --self-test failed (exit $($p.ExitCode))" }
